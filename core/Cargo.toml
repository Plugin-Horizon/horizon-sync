[package]
name = "horizonsync-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "HorizonSync: player data synchronisation (MariaDB/MySQL + Redis, HuskSync-compatible data format) for Horizon servers"

# Every dependency is in Horizon's Cargo.lock (mysql and redis with the features
# crates/horizon-mod-deps allows).
[dependencies]
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring", "chrono"] }
redis = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
snap = "1"
getrandom = "0.3"
