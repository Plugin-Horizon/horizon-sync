[package]
name = "mod-husksync"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The launcher (or stage.py) points this at the Horizon source the game is built from.
horizon-mod-api = { git = "https://github.com/arismoko/horizon" }
horizonsync-core = { path = "core" }
# Already in Horizon's lock: reads the gzip player file of a leave save (`player_save_to_file`).
flate2 = "1"
