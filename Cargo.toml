[package]
name = "mod-husksync"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# Already in Horizon's lock: reads the gzip player file of a leave save (`player_save_to_file`).
flate2 = "1"
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring", "chrono"] }
redis = { version = "1", default-features = false, features = ["tls-rustls", "sentinel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
snap = "1"
indexmap = { version = "2", features = ["serde"] }
getrandom = "0.3"


[features]
# Per-player advancement sync through `player_advancements` / `player_set_advancements`, which an open upstream pull
# request adds (gap-advancements); not in the pinned SDK yet, so off by default.
horizon_advancements = []
