# HorizonSync: player data sync (MariaDB/MySQL + Redis) for a Horizon dedicated server, with a
# data format compatible with HuskSync 4.1 (shares the database and Redis with Paper servers running it).
[mod]
id = "horizonsync"
version = "0.1.0"
priority = 100

[compatibility]
# Written against the player-state and lock hooks of Horizon; pinned to the revision in
# showcase/src/.horizon-revision (see STATUS.md for the hooks that are not on main).
horizon_revision = "b13dbf0687b545431172466ab4b91d19c3976405"

# Formats, database, Redis and the sync rules: no game types, unit-tested on its own.
[[crate]]
id = "core"
path = "core"
dependent = "horizon-client"

# The engine side: NBT conversion, applying a snapshot to a guest, capturing one.
# A child of `crate::game`, so it reaches Game's fields and the hub's guests.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "horizonsync"
source = "glue/horizonsync.rs"

[[injection]]
id = "start"
hook = "server_about_to_start"
hook_version = 1
kind = "HEAD"
helper = "helpers/start.rs"
bindings = [{ name = "dedicated", ty = "bool", value = "dedicated" }]

[[injection]]
id = "stopping"
hook = "server_stopping"
hook_version = 1
kind = "HEAD"
helper = "helpers/stopping.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "helpers/tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "world-saved"
hook = "world_saved"
hook_version = 1
kind = "HEAD"
helper = "helpers/world_saved.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "joined"
hook = "player_logged_in"
hook_version = 1
kind = "HEAD"
helper = "helpers/joined.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "name", ty = "&str", value = "name" },
]

# The player is still in their level when this is heard (Bukkit's PlayerQuitEvent), so the
# compound can be read with `native_player_compound`. Pending API fragment `player_logging_out`
# (needs "hooks": @API:player_logging_out@ once stamped).
[[injection]]
id = "leaving"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_logging_out"
kind = "HEAD"
helper = "helpers/leaving.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
]

[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "helpers/register_commands.rs"
bindings = [{ name = "commands", ty = "&mut Vec<crate::mod_api::NativeCommand>", value = "&mut *commands" }]

# Permission nodes: native_has_permission (hooks-all helper, API @API:permission_check@) decides
# horizonsync.command.* when a permissions mod answers; NativeCommand::permission (API
# @API:command_permission@) names the node on registration.
[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "helpers/perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::mod_api::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "console-command"
hook = "perform_console_command"
hook_version = 1
kind = "HEAD"
helper = "helpers/console_command.rs"
bindings = [
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# ----- the lock while a player's data loads (BukkitLockedEventListener) -----

[[injection]]
id = "lock-command"
hook = "player_command"
hook_version = 1
kind = "HEAD"
helper = "helpers/lock_command.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "lock-destroy"
hook = "destroy_block"
hook_version = 1
kind = "HEAD"
helper = "helpers/lock_acting.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "lock-left-click"
hook = "left_click_block"
hook_version = 1
kind = "HEAD"
helper = "helpers/lock_acting.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "lock-right-click"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "helpers/lock_acting.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Also stops placing a block by clicking it: a claimed use_item_on places nothing (place_block).
# Stands in for block_place (BukkitLockedEventListener.onBlockPlace), which is not on main yet.
[[injection]]
id = "lock-use-on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "helpers/lock_acting.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "canceled", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "lock-use"
hook = "use_item"
hook_version = 1
kind = "HEAD"
helper = "helpers/lock_acting.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "canceled", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "lock-attack"
hook = "attack_entity"
hook_version = 1
kind = "HEAD"
helper = "helpers/lock_acting.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "lock-interact"
hook = "interact_entity"
hook_version = 1
kind = "HEAD"
helper = "helpers/lock_acting.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "canceled", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "lock-pickup"
hook = "item_picked_up"
hook_version = 1
kind = "HEAD"
helper = "helpers/lock_player.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "lock-container"
hook = "container_opened"
hook_version = 1
kind = "HEAD"
helper = "helpers/lock_player.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "canceled", ty = "&mut bool", value = "&mut *cancel" },
]

[[injection]]
id = "lock-armor-stand"
hook = "armor_stand_manipulate"
hook_version = 1
kind = "HEAD"
helper = "helpers/lock_player.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "canceled", ty = "&mut bool", value = "&mut *cancel" },
]

# The victim's UUID comes with living_incoming_damage_v3 (pending API fragment
# living_incoming_damage_v3), no entity-id map needed.
[[injection]]
id = "lock-damage"
target = "horizon_client::game::native_hooks::Game<'_>::native_living_incoming_damage_v3"
kind = "HEAD"
helper = "helpers/lock_damage.rs"
bindings = [
  { name = "victim_uuid", ty = "Option<u128>", value = "victim_uuid" },
  { name = "canceled", ty = "&mut bool", value = "&mut *cancel" },
]

# PlayerDropItemEvent: item_dropped_v2 is cancellable (pending API fragment item_dropped_v2);
# the stack goes back into the inventory.
[[injection]]
id = "lock-drop"
target = "horizon_client::game::native_hooks::Game<'_>::native_item_dropped_v2"
kind = "HEAD"
helper = "helpers/lock_player.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "canceled", ty = "&mut bool", value = "&mut *cancel" },
]

# Editable /inventory and /enderchest: the input slots when the menu closes (pending API
# fragment menu_input).
[[injection]]
id = "menu-closed"
target = "horizon_client::game::native_hooks::Game<'_>::native_menu_input_closed"
kind = "HEAD"
helper = "helpers/menu_closed.rs"
bindings = [
  { name = "player", ty = "u128", value = "uuid" },
  { name = "window", ty = "i32", value = "window" },
  { name = "slots", ty = "&mut Vec<Option<horizon_client::items::ItemStack>>", value = "&mut *slots" },
]
